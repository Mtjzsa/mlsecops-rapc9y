name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, type check, tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pre-commit hooks (whitespace, YAML/TOML, flake8)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Pyright (standard mode, src/)
        run: pyright

      - name: Tests with coverage (min. 95%)
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
  docker:
    name: Docker image build and smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker compose build

      - name: Start MLflow and the API (waits until both are healthy)
        run: docker compose up -d --wait mlflow api

      - name: Smoke test
        run: |
          curl --fail --silent http://localhost:5000/health
          curl --fail --silent http://localhost:8000/health

      - name: Container logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
